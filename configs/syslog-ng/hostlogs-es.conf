# Logs systeme (auth/SSH) et Apache -> Elasticsearch via syslog-ng
# Fichier a placer dans /etc/syslog-ng/conf.d/ (s_src est defini dans syslog-ng.conf)

# --- Authentification : SSH, sudo, su... ---------------------------------------------
filter f_es_auth { facility(auth, authpriv); };

destination d_es_auth {
    http(
        url("https://localhost:9200/_bulk")
        persist-name("d_es_auth")
        method("POST")
        user("syslog_ng")
        password("__PASSWORD__")
        headers("Content-Type: application/x-ndjson")
        body("{\"index\":{\"_index\":\"syslog-auth-${YEAR}.${MONTH}.${DAY}\"}}\n$(format-json @timestamp=${ISODATE} host=${HOST} program=${PROGRAM} pid=${PID} severity=${LEVEL} message=${MESSAGE} log_type=auth)")
        body-suffix("\n")
        batch-lines(50)
        batch-timeout(2000)
        workers(1)
        timeout(10)
        tls(
            ca-file("/etc/syslog-ng/http_ca.crt")
            peer-verify(yes)
        )
    );
};

log {
    source(s_src);
    filter(f_es_auth);
    destination(d_es_auth);
};

# --- Apache : journal d'acces ----------------------------------------------------------
source s_apache_access {
    file("/var/log/apache2/access.log"
        follow-freq(1)
        flags(no-parse)
    );
};

parser p_apache {
    apache-accesslog-parser(prefix(".apache."));
};

destination d_es_apache {
    http(
        url("https://localhost:9200/_bulk")
        persist-name("d_es_apache")
        method("POST")
        user("syslog_ng")
        password("__PASSWORD__")
        headers("Content-Type: application/x-ndjson")
        body("{\"index\":{\"_index\":\"syslog-apache-${YEAR}.${MONTH}.${DAY}\"}}\n$(format-json --scope dot-nv-pairs --rekey .* --shift 1 @timestamp=${ISODATE} host=${HOST} log_type=apache_access message=${MESSAGE})")
        body-suffix("\n")
        batch-lines(50)
        batch-timeout(2000)
        workers(1)
        timeout(10)
        tls(
            ca-file("/etc/syslog-ng/http_ca.crt")
            peer-verify(yes)
        )
    );
};

log {
    source(s_apache_access);
    parser(p_apache);
    destination(d_es_apache);
};
