# Suricata (eve.json) -> Elasticsearch via syslog-ng
# Fichier a placer dans /etc/syslog-ng/conf.d/
#
# On utilise le driver http() de base plutot que elasticsearch-http() : la macro de
# syslog-ng 4.8 genere un champ "_type" invalide (rejete par Elasticsearch 8/9).
# Chaque document est envoye au format _bulk : une ligne d'action puis le JSON d'eve.json.

source s_suricata_eve {
    file("/var/log/suricata/eve.json"
        follow-freq(1)
        flags(no-parse)
    );
};

destination d_es_suricata {
    http(
        url("https://localhost:9200/_bulk")
        persist-name("d_es_suricata")
        method("POST")
        user("syslog_ng")
        password("__PASSWORD__")
        headers("Content-Type: application/x-ndjson")
        body("{\"index\":{\"_index\":\"suricata-eve-${YEAR}.${MONTH}.${DAY}\"}}\n$MSG")
        body-suffix("\n")
        batch-lines(100)
        batch-timeout(2000)
        workers(2)
        timeout(10)
        tls(
            ca-file("/etc/syslog-ng/http_ca.crt")
            peer-verify(yes)
        )
    );
};

log {
    source(s_suricata_eve);
    destination(d_es_suricata);
};
